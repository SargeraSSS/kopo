services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn fintrack.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      ALLOWED_HOSTS: web,localhost,127.0.0.1
    depends_on:
      - db

  bot:
    build: .
    command: python bot.py
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      API_URL: http://web:8000/api
    depends_on:
      - web

volumes:
  postgres_data: